{% extends "base.html" %}

{% block title %}Nuevo Cargo - Sistema de Reclutamiento{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="form-card">
                <div class="text-center mb-4">
                    <div class="feature-icon mx-auto" style="width: 70px; height: 70px; font-size: 2rem;">
                        <i class="bi bi-briefcase"></i>
                    </div>
                    <h2 class="text-white fw-bold">Crear Nuevo Cargo</h2>
                    <p class="text-muted">Registre una nueva vacante en el sistema</p>
                </div>

                <form method="POST" action="{{ url_for('nuevo_cargo') }}">
                    <div class="mb-3">
                        <label class="form-label">Nombre del Cargo *</label>
                        <input type="text" class="form-control" name="nombre" 
                               placeholder="Ej: Analista de Marketing Digital" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción *</label>
                        <textarea class="form-control" name="descripcion" rows="4" 
                                  placeholder="Describa las responsabilidades y requisitos..." required></textarea>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('lista_cargos') }}" class="btn btn-outline-light">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-check-lg me-2"></i>Crear Cargo
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
