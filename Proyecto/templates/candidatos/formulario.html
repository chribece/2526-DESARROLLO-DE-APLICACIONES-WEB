{% extends "base.html" %}

{% block title %}Nuevo Candidato - Sistema de Reclutamiento{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="form-card">
                <div class="text-center mb-4">
                    <div class="feature-icon mx-auto" style="width: 70px; height: 70px; font-size: 2rem;">
                        <i class="bi bi-person-plus"></i>
                    </div>
                    <h2 class="text-white fw-bold">Registro de Candidato</h2>
                    <p class="text-muted">Complete la información del nuevo postulante</p>
                </div>

                <form method="POST" action="{{ url_for('nuevo_candidato') }}" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Cédula *</label>
                            <input type="text" class="form-control" name="cedula" 
                                   placeholder="1801234567" required pattern="[0-9]{10}">
                            <div class="invalid-feedback">Ingrese una cédula válida (10 dígitos)</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Nombres Completos *</label>
                            <input type="text" class="form-control" name="nombres" 
                                   placeholder="Juan Pérez García" required minlength="3">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Correo Electrónico *</label>
                            <input type="email" class="form-control" name="correo" 
                                   placeholder="correo@ejemplo.com" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Teléfono *</label>
                            <input type="tel" class="form-control" name="telefono" 
                                   placeholder="0991234567" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Dirección *</label>
                            <textarea class="form-control" name="direccion" rows="2" 
                                      placeholder="Av. Principal 123, Ciudad" required></textarea>
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="{{ url_for('lista_candidatos') }}" class="btn btn-outline-light">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-check-lg me-2"></i>Guardar Candidato
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
